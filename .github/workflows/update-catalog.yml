name: Actualizar catálogo

on:
  schedule:
    - cron: "0 21 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Actualizar productos
        run: python scraper_productos.py
      - name: Publicar cambios del catálogo
        run: |
          git config user.name "AGNEXUSUIO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add productos.json catalogo_actualizado.js imagenes
          git diff --cached --quiet || git commit -m "chore: actualizar catálogo"
          git push
