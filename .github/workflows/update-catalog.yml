name: Actualizar catálogo

on:
  schedule:
    - cron: "0 21 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-catalogo
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Actualizar productos
        run: python scraper_productos.py
      - name: Publicar cambios del catálogo
        run: |
          git config user.name "AGNEXUSUIO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add productos.json catalogo_actualizado.js
          if [ -d imagenes ]; then git add imagenes; fi
          git diff --cached --quiet || git commit -m "chore: actualizar catálogo"
          git push origin HEAD:${GITHUB_REF_NAME}
